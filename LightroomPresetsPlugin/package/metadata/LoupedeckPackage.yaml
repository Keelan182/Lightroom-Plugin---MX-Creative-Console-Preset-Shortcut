# ==================================================================================================
# GENERAL SETTINGS
# ==================================================================================================

# Package type. Must be plugin4 for plugins.
type: plugin4

# Name that identifies the plugin.
name: LightroomPresets

# Plugin name that is shown to the user.
displayName: Lightroom Presets

# Short description of the plugin.
description: Assign Adobe Lightroom Desktop/CC develop presets to MX Creative Console buttons and apply them to the selected photo instantly, via Lightroom's own External Controller API.

# Name of the plugin library file.
pluginFileName: LightroomPresetsPlugin.dll

# Plugin version.
version: 1.0

# Author of the plugin.
author: keelan182

# Copyright information.
copyright: Copyright (c) 2026 keelan182. All rights reserved.

# Minimum SDK version supported by the plugin.
minimumLoupedeckVersion: 6.0


# ==================================================================================================
# PLUGIN PROPERTIES
# ==================================================================================================

# Location of plugin files on Windows (relative to the plugin base directory).
pluginFolderWin: bin

# Location of plugin files on macOS (relative to the plugin base directory).
pluginFolderMac: bin

# List of devices the plugin is optimized for.
supportedDevices:
    # Logitech MX Creative Console family devices (Keypad + Dialpad) - the
    # primary target for this plugin.
    - LoupedeckExtendedFamily

    # Loupedeck CT/Live/Live S and Razer Stream Controller family devices,
    # which share the same plugin API - included since nothing in this
    # plugin is MX Creative Console-specific.
    - LoupedeckCtFamily
